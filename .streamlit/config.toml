[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f6f5f2"
textColor = "#0b0b0b"
font = "sans serif"

[global]
disableWidgetStateDuplicationWarning = true

[server]
headless = true
runOnSave = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false
